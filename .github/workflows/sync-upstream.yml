name: sync-upstream

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'ddnowicki/CLIProxyAPI'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - name: Merge latest stable release into a candidate branch
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$(gh api repos/router-for-me/CLIProxyAPI/releases/latest --jq .tag_name)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          current="$(tr -d '\r\n' < .github/upstream-version)"
          if [[ "$tag" == "$current" ]]; then
            exit 0
          fi
          branch="upstream/${tag}"
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --base master --head "$branch" --state open --json number --jq length)"
          if [[ "$existing" != 0 ]]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git fetch --no-tags https://github.com/router-for-me/CLIProxyAPI.git "refs/tags/$tag"
          upstream="$(git rev-parse 'FETCH_HEAD^{commit}')"
          if ! git merge --no-ff -m "chore: merge upstream ${tag}" "$upstream"; then
            echo '::error::Upstream merge conflicts require manual review; the deployed branch has not changed.'
            git merge --abort
            exit 1
          fi
          printf '%s\n' "$tag" > .github/upstream-version
          git add .github/upstream-version
          git commit -m "chore: record upstream ${tag}"
          echo 'sync=true' >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: steps.candidate.outputs.sync == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify candidate without write credentials
        if: steps.candidate.outputs.sync == 'true'
        run: |
          set -euo pipefail
          go test -count=1 -skip '^TestToolSearchDisabledMatchesDevGolden$' ./...
          go test -race -count=1 -run 'Test(PoolCooldown|ModelCooldownErrorClientReset|TerminalPoolCooldown|ClaudePoolCooldown|SharedCooldown)' ./sdk/cliproxy/auth ./sdk/api/handlers/claude
          go build -buildvcs=false -o /tmp/cli-proxy-api ./cmd/server
      - name: Open tested upstream update PR
        if: steps.candidate.outputs.sync == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.candidate.outputs.branch }}
          TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git push origin "$BRANCH"
          head="$(git rev-parse HEAD)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${head}" \
            -f state=success -f context='upstream / tests and build' \
            -f description='Repository tests, cooldown race regressions and server build passed' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh pr create --repo "$GITHUB_REPOSITORY" --base master --head "$BRANCH" \
            --title "chore: merge upstream ${TAG}" \
            --body 'Stable upstream release merged with the existing fork changes. Repository tests (with the documented baseline golden exclusion), cooldown race regressions and server build passed. Merge conflicts stop this workflow instead of dropping local patches. Manual approval is required; no production deployment is performed.'
